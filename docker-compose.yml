services:
  reepay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REEPAY_PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reepay?schema=public
      REDIS_URL: redis://redis:6379
      REEPAY_API_KEY: local-public-api-key
      REEPAY_FEE_TYPE: fixed
      REEPAY_FEE_FIXED: 0
      REEPAY_FEE_PERCENT: 0
      REEPAY_FEE_CURRENCY: XAF
      REEPAY_ENV: sandbox
      KRYPTAPAY_BASE_URL: https://provider.example.invalid
      KRYPTAPAY_API_KEY: local-kryptapay-key
      KRYPTAPAY_WEBHOOK_SECRET: local-kryptapay-webhook-secret
      WISE_BASE_URL: https://api.wise.com
      WISE_API_TOKEN: ""
      WISE_PROFILE_ID: ""
      WISE_EUR_BALANCE_ID: ""
      REEPAY_EUR_PAYOUT_FEE_FIXED: 0
      REEPAY_EUR_PAYOUT_FEE_PERCENT: 0
      REEPAY_USDC_PAYOUT_FEE_FIXED: 0
      REEPAY_USDC_PAYOUT_FEE_PERCENT: 0
      SANGAPAY_WEBHOOK_ENABLED: "false"
      SANGAPAY_WEBHOOK_URL: https://sangapay-backend.example.com/webhooks/reepay
      SANGAPAY_WEBHOOK_SECRET: local-sangapay-webhook-secret
    ports:
      - "4000:4000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reepay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reepay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
